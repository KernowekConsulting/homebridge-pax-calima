name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        homebridge: [homebridge, homebridge1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y bluetooth libbluetooth-dev libudev-dev
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
        env:
          HOMEBRIDGE_TEST_MODULE: ${{ matrix.homebridge }}
      - run: npm pack --dry-run
